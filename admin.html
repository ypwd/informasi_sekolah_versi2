<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Display</title><link rel="icon" href="logo.png"><style>body{font-family:Arial;margin:0;background:#eef3f9;color:#10264d}.wrap{max-width:1100px;margin:auto;padding:25px}.head{background:#08275a;color:white;padding:18px;border-radius:16px;display:flex;gap:15px;align-items:center}.head img{width:70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-top:15px}.card{background:white;padding:18px;border-radius:14px}.card h2{margin-top:0}input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccd6e5;border-radius:8px;box-sizing:border-box}textarea{min-height:80px}button{background:#0b4cc2;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}</style></head><body><div class="wrap"><div class="head"><img src="logo.png"><div><h1>Admin Display Informasi Sekolah</h1><div>SMKS Widya Dirgantara Bandung</div></div></div><div class="grid"><div class="card"><h2>Pengumuman</h2><input id="j" placeholder="Judul"><textarea id="i" placeholder="Isi"></textarea><input id="m" type="date"><input id="s" type="date"><button onclick="save('savePengumuman',{Judul:j.value,Isi:i.value,TanggalMulai:m.value,TanggalSelesai:s.value,Prioritas:1,Aktif:'YA'})">Simpan</button></div><div class="card"><h2>Agenda</h2><input id="d" type="date"><input id="jam" placeholder="07.00"><input id="k" placeholder="Kegiatan"><input id="t" placeholder="Tempat"><button onclick="save('saveAgenda',{Tanggal:d.value,Jam:jam.value,Kegiatan:k.value,Tempat:t.value,Aktif:'YA'})">Simpan</button></div><div class="card"><h2>Prestasi</h2><input id="n" placeholder="Nama siswa"><input id="kl" placeholder="Kelas"><input id="p" placeholder="Prestasi"><input id="tg" placeholder="Tingkat"><button onclick="save('savePrestasi',{NamaSiswa:n.value,Kelas:kl.value,Prestasi:p.value,Tingkat:tg.value,Tanggal:new Date().toISOString().slice(0,10),Aktif:'YA'})">Simpan</button></div><div class="card"><h2>Galeri</h2><input id="gj" placeholder="Judul"><input id="gf" placeholder="URL foto"><input id="gk" placeholder="Keterangan"><button onclick="save('saveGaleri',{Judul:gj.value,Foto:gf.value,Keterangan:gk.value,Tanggal:new Date().toISOString().slice(0,10),Urutan:1,Aktif:'YA'})">Simpan</button></div><div class="card"><h2>Running Text</h2><textarea id="rt" placeholder="Informasi berjalan"></textarea><button onclick="save('saveRunningText',{Teks:rt.value,Aktif:'YA',Urutan:1})">Simpan</button></div></div><p id="msg"></p></div><script>const API_URL='https://script.google.com/macros/s/AKfycbyfqqN3WhRl5rasgXVOuWHRcmRgtUP1mdM2Kh2PZOGFyNKt9w62Ob7vIvfyXXiYrQJfuA/exec';function callApi(action,data={}){
 return new Promise((resolve,reject)=>{
  const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');
  const params=new URLSearchParams({action,callback:cb,...data});
  const timer=setTimeout(()=>{cleanup();reject(Error('Timeout menghubungi backend Apps Script.'))},15000);
  function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}
  window[cb]=j=>{cleanup();j.success?resolve(j.data):reject(Error(j.message||'Backend error'))};
  s.onerror=()=>{cleanup();reject(Error('Backend tidak dapat diakses.'))};
  s.src=API_URL+'?'+params.toString();document.head.appendChild(s);
 })
}
async function save(a,d){try{await callApi(a,d);msg.textContent='Data tersimpan.'}catch(e){msg.textContent=e.message}}</script></body></html>
